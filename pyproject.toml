[project]
name = "gyanlabs-enterprise-rag"
version = "1.0.0"
description = "Enterprise-Grade Multi-Source Retrieval-Augmented Generation (RAG) & Semantic Intent Routing Platform."
readme = "README.md"
authors = [
    { name = "Harish Dhakal", email = "harish.dhakal@gyanlabs.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
ai = [
    "groq>=0.9.0",
    "openai>=1.20.0",
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
    "pypdf>=4.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
